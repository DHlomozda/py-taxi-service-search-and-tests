{% extends "base.html" %}

{% block content %}
  <h1>
    Car list
    <a href="{% url 'taxi:car-create' %}" class="btn btn-primary link-to-page">
      Create
    </a>
  </h1>
  {% if car_list %}
    <ul>
      {% for car in car_list %}
        <li>
          <a href="{% url "taxi:car-detail" pk=car.id %} ">{{ car.id }}</a>
          {{ car.model }} ({{ car.manufacturer.name }})
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no cars in taxi</p>
  {% endif %}
  <div>
    <form method="post" action="{% url 'taxi:search-car' %}">
      {% csrf_token %}
      <label for="search-field"></label>
      <input type="text" name="search" placeholder="Search..." id="search-field">
      <button type="submit">Search</button>
    </form>
  </div>
{% endblock %}
